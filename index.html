<script>

/* =====================================
   DETEKSI PERANGKAT
===================================== */

function detectDevice() {

  const userAgent = navigator.userAgent || "";

  const isPhone =
    /Android|iPhone|iPod|Mobile|Windows Phone/i.test(userAgent);

  const isTablet =
    /iPad|Tablet/i.test(userAgent);

  const isNarrowScreen =
    window.innerWidth <= 700;

  const isTouchDevice =
    window.matchMedia("(pointer: coarse)").matches &&
    window.innerWidth <= 1100;

  const useMobile =
    isPhone || isTablet || isNarrowScreen || isTouchDevice;

  document.body.classList.toggle(
    "mobile-device",
    useMobile
  );

  document.body.classList.toggle(
    "desktop-device",
    !useMobile
  );

}

detectDevice();

window.addEventListener("resize", detectDevice);


/* =====================================
   SISTEM SLIDESHOW
===================================== */

function initializeSlideshow(container) {

  const slides =
    container.querySelectorAll(".slide-image");

  const dots =
    container.querySelectorAll(".mobile-dots span");

  let currentSlide = 0;
  let timer;

  function showSlide(index) {

    currentSlide =
      (index + slides.length) % slides.length;

    slides.forEach((slide, i) => {

      slide.classList.toggle(
        "active",
        i === currentSlide
      );

    });

    dots.forEach((dot, i) => {

      dot.classList.toggle(
        "active",
        i === currentSlide
      );

    });

  }

  function startTimer() {

    timer = setInterval(() => {

      showSlide(currentSlide + 1);

    }, 5000);

  }

  function change(direction) {

    showSlide(currentSlide + direction);

    clearInterval(timer);

    startTimer();

  }

  container.querySelectorAll(".slide-button")
    .forEach(button => {

      button.addEventListener("click", () => {

        const direction =
          button.classList.contains("next-button") ? 1 : -1;

        change(direction);

      });

    });

  showSlide(0);

  startTimer();

}

/* AKTIFKAN SLIDESHOW DESKTOP DAN MOBILE */

document.querySelectorAll(".slideshow")
  .forEach(initializeSlideshow);

</script>
