
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natal Kementerian Keuangan Sumatera Utara 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

/* =====================================
   DESKTOP
===================================== */

.desktop-page {
    display: block;
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #30231f;
}

.desktop-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
}

/* SLIDESHOW DESKTOP */

.desktop-slideshow {
    position: absolute;
    left: 47.4%;
    top: 14%;
    width: 47.4%;
    height: 52.5%;
    overflow: hidden;
    border: 2px solid white;
    border-radius: 13px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    background: #332b27;
}

.desktop-slideshow img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.desktop-slide-title {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 75px;
    padding: 0 150px 0 28px;
    display: flex;
    align-items: center;
    color: white;
    font-size: clamp(14px, 1.3vw, 19px);
    font-weight: bold;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.48),
        rgba(0,0,0,0)
    );
    z-index: 2;
}

.desktop-slide-title span {
    margin-right: 12px;
}

/* PANAH SLIDESHOW */

.slide-button {
    position: absolute;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    color: #173c60;
    font-size: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
    transition: background 0.2s, transform 0.2s;
}

.slide-button:hover {
    background: white;
    transform: scale(1.08);
}

.desktop-slideshow .prev {
    top: 22px;
    right: 80px;
}

.desktop-slideshow .next {
    top: 22px;
    right: 15px;
}

/* MENU DESKTOP */

.desktop-menu {
    position: absolute;
    top: 69.5%;
    height: 23%;
    z-index: 10;
    cursor: pointer;
}

.desktop-menu.menu-1 {
    left: 8.2%;
    width: 20.9%;
}

.desktop-menu.menu-2 {
    left: 29.9%;
    width: 20%;
}

.desktop-menu.menu-3 {
    left: 50.8%;
    width: 20.9%;
}

.desktop-menu.menu-4 {
    left: 72.5%;
    width: 20.7%;
}


/* =====================================
   EFEK KLIK MENU DESKTOP DAN MOBILE
===================================== */

.desktop-menu,
.mobile-menu {
    -webkit-tap-highlight-color: transparent;
    outline: none;
}

.desktop-menu::after,
.mobile-menu::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 3px solid rgba(255,255,255,0);
    border-radius: 15px;
    background: rgba(255,255,255,0);
    box-shadow: 0 0 0 rgba(255,255,255,0);
    opacity: 0;
    pointer-events: none;
    transition: none;
}

.desktop-menu.is-selected::after,
.mobile-menu.is-selected::after {
    opacity: 1;
    border-color: rgba(255,255,255,0.95);
    background: rgba(255,255,255,0.13);
    box-shadow:
        0 0 12px rgba(255,255,255,0.95),
        0 0 25px rgba(120,190,255,0.8),
        inset 0 0 12px rgba(255,255,255,0.55);
    animation: menuFlash 0.18s ease-in-out;
}

@keyframes menuFlash {
    0% {
        opacity: 0;
        transform: scale(0.97);
    }

    50% {
        opacity: 1;
        transform: scale(1.01);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================
   MOBILE
===================================== */

.mobile-page {
    display: none;
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    aspect-ratio: 852 / 1846;
    overflow: hidden;
    background: #f8eee7;
}

.mobile-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* SLIDESHOW MOBILE */

.mobile-slideshow {
    position: absolute;
    left: 4%;
    top: 32.5%;
    width: 92%;
    height: 23.5%;
    background: #fffaf6;
    border: 3px solid white;
    border-radius: 19px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(70,45,30,0.20);
    z-index: 4;
}

/* HEADER MOBILE */

.mobile-slide-header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 17%;
    padding: 0 15px;
    display: flex;
    align-items: center;
    gap: 9px;
    background: #fffaf6;
    color: #173c60;
    font-size: clamp(12px, 3.5vw, 17px);
    font-weight: bold;
    z-index: 3;
}

.mobile-camera {
    font-size: clamp(18px, 4.5vw, 23px);
}

/* FOTO MOBILE */

.mobile-slide-photo {
    position: absolute;
    left: 0;
    top: 17%;
    width: 100%;
    height: 83%;
    overflow: hidden;
    background: #ddd;
}

.mobile-slide-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* PANAH MOBILE */

.mobile-slideshow .slide-button {
    top: 58.5%;
    transform: translateY(-50%);
    width: 33px;
    height: 33px;
    font-size: 21px;
    color: #173c60;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.mobile-slideshow .prev {
    left: 9px;
}

.mobile-slideshow .next {
    right: 9px;
}

/* MENU MOBILE */

.mobile-menu {
    position: absolute;
    width: 44%;
    height: 14%;
    z-index: 10;
    cursor: pointer;
}

.mobile-menu.menu-1 {
    left: 3.5%;
    top: 56.45%;
}

.mobile-menu.menu-2 {
    left: 50%;
    top: 56.45%;
}

.mobile-menu.menu-3 {
    left: 3.5%;
    top: 71.8%;
}

.mobile-menu.menu-4 {
    left: 50%;
    top: 71.8%;
}


/* =====================================
   RESPONSIVE OTOMATIS
===================================== */

@media screen and (max-width: 700px) {
    html, body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        background: #30231f;
    }

    .desktop-page {
        display: none !important;
    }

    .mobile-page {
        display: block !important;
    }
}

@media screen and (min-width: 701px) {
    html, body {
        overflow: hidden;
    }

    .desktop-page {
        display: block !important;
    }

    .mobile-page {
        display: none !important;
    }
}

<!-- =====================================
     JAVASCRIPT SLIDESHOW OTOMATIS
===================================== -->

<script>

const slides = [
    "Dokumentasi%20Natal/Foto%201.jpeg",
    "Dokumentasi%20Natal/Foto%202.jpeg",
    "Dokumentasi%20Natal/Foto%203.jpeg"
];

let currentSlide = 0;
let slideTimer;

/* Menampilkan foto yang dipilih */

function showSlide() {
    document.getElementById("desktopSlide").src =
        slides[currentSlide];

    document.getElementById("mobileSlide").src =
        slides[currentSlide];
}

/* Mengganti foto manual */

function changeSlide(direction) {
    currentSlide =
        (currentSlide + direction + slides.length) % slides.length;

    showSlide();

    // Mulai ulang hitungan otomatis setelah tombol ditekan
    startSlideshow();
}

/* Slideshow otomatis setiap 5 detik */

function startSlideshow() {
    clearInterval(slideTimer);

    slideTimer = setInterval(function() {
        currentSlide =
            (currentSlide + 1) % slides.length;

        showSlide();
    }, 5000);
}

/* Jalankan slideshow saat website dibuka */

showSlide();
startSlideshow();


/* =====================================
   EFEK KILAT SAAT MENU DIKLIK
===================================== */

document.querySelectorAll(".desktop-menu, .mobile-menu")
    .forEach(function(menu) {

        menu.addEventListener("click", function(event) {

            event.preventDefault();

            const destination = this.href;

            this.classList.add("is-selected");

            // Beri waktu agar efek kilat terlihat
            setTimeout(function() {
                window.location.href = destination;
            }, 180);

        });

    });

</script>
