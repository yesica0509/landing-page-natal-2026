<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

/* =================================
   TAMPILAN DESKTOP / LAPTOP
================================= */

.desktop-page {
    display: block;
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.desktop-background {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
}

/* SLIDESHOW DESKTOP */

.desktop-slideshow {
    position: absolute;
    left: 47.4%;
    top: 14%;
    width: 47.4%;
    height: 52.5%;
    overflow: hidden;
}

.desktop-slideshow img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.slide-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    color: #5b2020;
    font-size: 24px;
    cursor: pointer;
    z-index: 5;
}

.slide-button:hover {
    background: white;
}

.prev {
    left: 10px;
}

.next {
    right: 10px;
}

/* MENU DESKTOP */

.desktop-menu {
    position: absolute;
    top: 69.5%;
    height: 23%;
    cursor: pointer;
    z-index: 10;
}

.desktop-menu.menu-1 {
    left: 8.2%;
    width: 20.9%;
}

.desktop-menu.menu-2 {
    left: 29.9%;
    width: 20%;
}

.desktop-menu.menu-3 {
    left: 50.8%;
    width: 20.9%;
}

.desktop-menu.menu-4 {
    left: 72.5%;
    width: 20.7%;
}

/* =================================
   TAMPILAN MOBILE / HP
================================= */

.mobile-page {
    display: none;
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    aspect-ratio: 852 / 1846;
    overflow: hidden;
}

.mobile-background {
    width: 100%;
    height: 100%;
    display: block;
}

/* SLIDESHOW MOBILE */

.mobile-slideshow {
    position: absolute;
    left: 3.5%;
    top: 33.37%;
    width: 90.4%;
    height: 21.35%;
    overflow: hidden;
}

.mobile-slideshow img {
    position: absolute;
    top: 18.5%;
    left: 0;
    width: 100%;
    height: 81.5%;
    object-fit: cover;
    display: block;
}

.mobile-slideshow .slide-button {
    width: 27px;
    height: 27px;
    font-size: 18px;
}

.mobile-slideshow .prev {
    left: 5px;
}

.mobile-slideshow .next {
    right: 5px;
}

/* MENU MOBILE */

.mobile-menu {
    position: absolute;
    width: 44%;
    height: 14%;
    cursor: pointer;
    z-index: 10;
}

.mobile-menu.menu-1 {
    left: 3.5%;
    top: 56.45%;
}

.mobile-menu.menu-2 {
    left: 50%;
    top: 56.45%;
}

.mobile-menu.menu-3 {
    left: 3.5%;
    top: 71.8%;
}

.mobile-menu.menu-4 {
    left: 50%;
    top: 71.8%;
}

/* =================================
   RESPONSIVE OTOMATIS
================================= */

@media screen and (max-width: 700px) {
    html, body {
        width: 100%;
        min-height: 100%;
        background: #281d1b;
        overflow-x: hidden;
    }

    .desktop-page {
        display: none !important;
    }

    .mobile-page {
        display: block !important;
    }
}

@media screen and (min-width: 701px) {
    .desktop-page {
        display: block !important;
    }

    .mobile-page {
        display: none !important;
    }
}
</style>

     JAVASCRIPT SLIDESHOW
================================= -->

<script>
const slides = [
    "Dokumentasi%20Natal/Foto%201.jpeg",
    "Dokumentasi%20Natal/Foto%202.jpeg",
    "Dokumentasi%20Natal/Foto%203.jpeg"
];

let currentSlide = 0;

function changeSlide(direction, imageId) {
    currentSlide = (currentSlide + direction + slides.length) % slides.length;

    document.getElementById("desktopSlide").src = slides[currentSlide];
    document.getElementById("mobileSlide").src = slides[currentSlide];
}

// Samakan foto awal pada kedua tampilan
document.getElementById("desktopSlide").src = slides[currentSlide];
document.getElementById("mobileSlide").src = slides[currentSlide];
</script>
