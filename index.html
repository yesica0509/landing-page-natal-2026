
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natal Kementerian Keuangan Sumatera Utara 2026</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* =====================================
   TAMPILAN FULL SCREEN
===================================== */

body {
  background: #241c1a;
  display: flex;
  justify-content: center;
  align-items: center;
}

.landing-page {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: none;
  overflow: hidden;
  line-height: 0;
}

.main-design {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

/* =====================================
   KOTAK DOKUMENTASI
===================================== */

.slideshow {
  position: absolute;
  left: 47.4%;
  top: 14.0%;
  width: 47.4%;
  height: 52.5%;

  overflow: hidden;
  border-radius: 2%;
  border: 2px solid rgba(255,255,255,0.95);

  background: #302720;
  z-index: 4;

  box-shadow:
    0 8px 24px rgba(0,0,0,0.20),
    0 2px 5px rgba(0,0,0,0.12);
}

/* FOTO MEMENUHI BINGKAI */

.slide-image {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center center;

  opacity: 0;
  transition: opacity 0.8s ease;
}

.slide-image.active {
  opacity: 1;
}

/* =====================================
   JUDUL DOKUMENTASI
===================================== */

.slide-header {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 22%;

  display: flex;
  align-items: center;
  gap: 10px;

  padding: 0 3.5%;

  background: linear-gradient(
    to bottom,
    rgba(15,25,35,0.48),
    rgba(15,25,35,0.12),
    transparent
  );

  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: clamp(12px, 1.2vw, 18px);
  font-weight: 700;

  text-shadow: 0 1px 4px rgba(0,0,0,0.65);

  z-index: 5;
}

.camera-icon {
  font-size: clamp(15px, 1.5vw, 22px);
}

/* =====================================
   TOMBOL PANAH SLIDESHOW
===================================== */

.slide-button {
  position: absolute;
  top: 5%;

  width: 6.5%;
  aspect-ratio: 1;

  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 50%;

  background: rgba(255,255,255,0.90);
  color: #173957;

  font-size: clamp(17px, 2vw, 26px);

  display: flex;
  justify-content: center;
  align-items: center;

  cursor: pointer;
  z-index: 6;

  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: 0.25s;
}

.slide-button:hover {
  background: #ffffff;
  transform: scale(1.08);
}

.prev-button {
  right: 11%;
}

.next-button {
  right: 2%;
}

/* =====================================
   EMPAT MENU SHAREPOINT
===================================== */

.menu-link {
  position: absolute;
  top: 69.5%;
  height: 23%;

  display: block;
  cursor: pointer;

  border-radius: 18px;
  background: transparent;

  transition: background 0.2s ease;
  z-index: 7;
}

.menu-link:hover {
  background: rgba(255,255,255,0.12);
  outline: 2px solid rgba(255,255,255,0.85);
}

.menu-2025 {
  left: 8.2%;
  width: 20.9%;
}

.menu-kontak {
  left: 29.9%;
  width: 20%;
}

.menu-2026 {
  left: 50.8%;
  width: 20.9%;
}

.menu-jadwal {
  left: 72.5%;
  width: 20.7%;
}

/* =====================================
   RESPONSIVE
===================================== */

@media (max-width: 600px) {
  .menu-link {
    border-radius: 8px;
  }

  .slide-header {
    gap: 4px;
  }

  .slide-button {
    width: 7%;
  }
}

</style>
</head>

<body>

<main class="landing-page">

  <!-- DESAIN UTAMA NATAL -->

  <img
    class="main-design"
    src="Portal%20Natal%20Kementerian%20Keuangan%202026%20(3).png"
    alt="Natal Kementerian Keuangan Sumatera Utara 2026"
  >

  <!-- SLIDESHOW DOKUMENTASI -->

  <div class="slideshow">

    <img
      class="slide-image active"
      src="Dokumentasi%20Natal/Foto%201.jpeg"
      alt="Dokumentasi kegiatan foto 1"
    >

    <img
      class="slide-image"
      src="Dokumentasi%20Natal/Foto%202.jpeg"
      alt="Dokumentasi kegiatan foto 2"
    >

    <img
      class="slide-image"
      src="Dokumentasi%20Natal/Foto%203.jpeg"
      alt="Dokumentasi kegiatan foto 3"
    >

    <div class="slide-header">

    </div>

    <button

    <button
      class="slide-button next-button"
      onclick="changeSlide(1)"
      aria-label="Foto berikutnya"
    >›</button>

  </div>

  <!-- DOKUMEN NATAL 2025 -->

  <a
    class="menu-link menu-2025"
    href="https://kemenkeu.sharepoint.com/:f:/r/sites/ForumKanwilDJPbProvinsiSumateraUtara/Shared%20Documents/General/Natal%20Kemenkeu%20Sumut%20Tahun%202026/NATAL%202025%20(PIC%20BC)?d=w3260b0952d4d415597d765fe60072ab9&csf=1&web=1&e=eofxs4"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Dokumen Natal 2025"
  ></a>

  <!-- KONTAK PANITIA -->

  <a
    class="menu-link menu-kontak"
    href="https://kemenkeu.sharepoint.com/sites/ForumKanwilDJPbProvinsiSumateraUtara/Shared%20Documents/Forms/List.aspx?viewid=f0790d9a%2D7585%2D4224%2D96a0%2D22daa0f1501b&id=%2Fsites%2FForumKanwilDJPbProvinsiSumateraUtara%2FShared%20Documents%2FGeneral%2FNatal%20Kemenkeu%20Sumut%20Tahun%202026%2FDokumen%202026%2FSusunan%20Panitia%20Natal%20Kemenkeu%20Sumut%202026%2Epdf&parent=%2Fsites%2FForumKanwilDJPbProvinsiSumateraUtara%2FShared%20Documents%2FGeneral%2FNatal%20Kemenkeu%20Sumut%20Tahun%202026%2FDokumen%202026"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Kontak Panitia 2026"
  ></a>

  <!-- DOKUMEN NATAL 2026 -->

  <a
    class="menu-link menu-2026"
    href="https://kemenkeu.sharepoint.com/sites/ForumKanwilDJPbProvinsiSumateraUtara/Shared%20Documents/Forms/List.aspx?id=%2Fsites%2FForumKanwilDJPbProvinsiSumateraUtara%2FShared%20Documents%2FGeneral%2FNatal%20Kemenkeu%20Sumut%20Tahun%202026%2FDokumen%202026%2FUndangan%20dan%20Notula%20dan%20Detil%20Dokumen&viewid=f0790d9a%2D7585%2D4224%2D96a0%2D22daa0f1501b&d=wa404ef763e0547a780e1fc00a59af11c&csf=1&CID=39c8dddd%2D5429%2D401b%2D8295%2Dba82dea2911d&FolderCTID=0x012000CBF6E11810F4AE479F0928ABC8E0FB35"
    target="_blank"

  ></a>

  <!-- JADWAL RAPAT -->

  <a

    href="https://kemenkeu.sharepoint.com/:x:/r/sites/ForumKanwilDJPbProvinsiSumateraUtara/Shared%20Documents/General/Natal%20Kemenkeu%20Sumut%20Tahun%202026/NATAL%202026/Kertas%20Kerja%20Panitia%20DJPb%20untuk%20Natal%20Tahun%202026.xlsx?d=w89e58e8e062a4c238f2764d534b44660&csf=1&web=1&e=1vyyAu"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Jadwal Rapat"
  ></a>

</main>

<script>

/* =====================================
   SISTEM SLIDESHOW
===================================== */

const slides = document.querySelectorAll(".slide-image");

let currentSlide = 0;
let slideTimer;

/* MENAMPILKAN FOTO */

function showSlide(index) {
  currentSlide = (index + slides.length) % slides.length;

  slides.forEach((slide, i) => {
    slide.classList.toggle("active", i === currentSlide);
  });
}

/* TOMBOL PANAH */

function changeSlide(direction) {
  showSlide(currentSlide + direction);
  restartTimer();
}

/* PERGANTIAN OTOMATIS SETIAP 5 DETIK */

function startTimer() {
  slideTimer = setInterval(() => {
    showSlide(currentSlide + 1);
  }, 5000);
}

/* RESET TIMER */

function restartTimer() {
  clearInterval(slideTimer);
  startTimer();
}

/* MULAI DARI FOTO PERTAMA */

showSlide(0);
startTimer();

</script>

</body>
</html>
