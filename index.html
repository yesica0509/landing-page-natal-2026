
<!DOCTYPE html>
<html lang="id">

<meta charset="UTF-8">

<title>Natal Kementerian Keuangan Sumatera Utara 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

/* =====================================
   DESKTOP - DESAIN ASLI
===================================== */

.desktop-page {
    display: block;
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #30231f;
}

.desktop-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
}

/* DOKUMENTASI DESKTOP */

.desktop-slideshow {
    position: absolute;
    left: 47.4%;
    top: 14%;
    width: 47.4%;
    height: 52.5%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.95);
    border-radius: 13px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    background: #332b27;
}

.desktop-slideshow img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Judul dokumentasi */

.desktop-slide-title {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 75px;
    padding: 0 85px 0 28px;
    display: flex;
    align-items: center;
    color: white;
    font-size: clamp(14px, 1.3vw, 19px);
    font-weight: bold;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.45),
        rgba(0,0,0,0)
    );
    z-index: 2;
}

.desktop-slide-title span {
    margin-right: 12px;
}

/* Tombol slideshow */

.slide-button {
    position: absolute;
    top: 22px;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    color: #263b50;
    font-size: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
    transition: background 0.2s;
}

.slide-button:hover {
    background: white;
}

.desktop-slideshow .prev {
    right: 80px;
}

.desktop-slideshow .next {
    right: 15px;
}

/* Area klik menu desktop */

.desktop-menu {
    position: absolute;
    top: 69.5%;
    height: 23%;
    z-index: 10;
    cursor: pointer;
}

.desktop-menu.menu-1 {
    left: 8.2%;
    width: 20.9%;
}

.desktop-menu.menu-2 {
    left: 29.9%;
    width: 20%;
}

.desktop-menu.menu-3 {
    left: 50.8%;
    width: 20.9%;
}

.desktop-menu.menu-4 {
    left: 72.5%;
    width: 20.7%;
}


/* =====================================
   MOBILE - DESAIN PORTRAIT
===================================== */

.mobile-page {
    display: none;
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    aspect-ratio: 852 / 1846;
    overflow: hidden;
    background: #30231f;
}

.mobile-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* Slideshow mobile */

.mobile-slideshow {
    position: absolute;
    left: 3.5%;
    top: 33.37%;
    width: 90.4%;
    height: 21.35%;
    overflow: hidden;
    z-index: 2;
}

.mobile-slideshow img {
    position: absolute;
    left: 0;
    top: 18.5%;
    width: 100%;
    height: 81.5%;
    object-fit: cover;
}

.mobile-slideshow .slide-button {
    top: 23%;
    width: 29px;
    height: 29px;
    font-size: 17px;
}

.mobile-slideshow .prev {
    left: 5px;
}

.mobile-slideshow .next {
    right: 5px;
}

/* Area klik menu mobile */

.mobile-menu {
    position: absolute;
    width: 44%;
    height: 14%;
    z-index: 10;
    cursor: pointer;
}

.mobile-menu.menu-1 {
    left: 3.5%;
    top: 56.45%;
}

.mobile-menu.menu-2 {
    left: 50%;
    top: 56.45%;
}

.mobile-menu.menu-3 {
    left: 3.5%;
    top: 71.8%;
}

.mobile-menu.menu-4 {
    left: 50%;
    top: 71.8%;
}


/* =====================================
   PENGATURAN RESPONSIVE OTOMATIS
===================================== */

@media screen and (max-width: 700px) {

    html, body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        background: #30231f;
    }

    .desktop-page {
        display: none !important;
    }

    .mobile-page {
        display: block !important;
    }
}

@media screen and (min-width: 701px) {

    html, body {
        overflow: hidden;
    }

    .desktop-page {
        display: block !important;
    }

    .mobile-page {
        display: none !important;
    }
}

</style>

<!-- =====================================
     JAVASCRIPT SLIDESHOW
===================================== -->

<script>

const slides = [
    "Dokumentasi%20Natal/Foto%201.jpeg",
    "Dokumentasi%20Natal/Foto%202.jpeg",
    "Dokumentasi%20Natal/Foto%203.jpeg"
];

let currentSlide = 0;

function showSlide() {
    document.getElementById("desktopSlide").src = slides[currentSlide];
    document.getElementById("mobileSlide").src = slides[currentSlide];
}

function changeSlide(direction) {
    currentSlide =
        (currentSlide + direction + slides.length) % slides.length;

    showSlide();
}

showSlide();

</script>
